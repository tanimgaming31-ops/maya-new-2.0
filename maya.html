<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020205">
<title>Maya — Your Voice Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500&family=Poppins:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#020205; --a:#7c3aed; --b:#2563eb; --pink:#ff5ccf;
  --text:#ece8ff; --muted:#a79fd0; --line:rgba(150,130,255,.35);
  --glass:rgba(18,14,44,.62);
}
[data-bg=night]{--a:#7c3aed;--b:#2563eb;--base:#020205}
[data-bg=blue]{--a:#2563eb;--b:#22d3ee;--base:#020a1a}
[data-bg=pink]{--a:#ec4899;--b:#a855f7;--base:#12030e}
[data-bg=violet]{--a:#a855f7;--b:#6366f1;--base:#08031c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:'Poppins','Noto Sans Bengali',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:
   radial-gradient(circle at 50% 36%, color-mix(in srgb,var(--a) 30%,transparent), transparent 58%),
   radial-gradient(circle at 92% 12%, color-mix(in srgb,var(--b) 22%,transparent), transparent 40%),
   radial-gradient(circle at 8% 70%, color-mix(in srgb,var(--a) 16%,transparent), transparent 45%),
   var(--base);}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* header */
.top{display:flex;align-items:flex-start;gap:8px;padding:8px 14px 0;position:relative;z-index:5;min-height:92px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:400 54px/0.9 'Great Vibes',cursive;color:#e4dcff;text-shadow:0 0 10px #8b5cf6,0 0 26px #6d3df0}
.brand h1 span{color:#c084fc;font-size:22px;vertical-align:top}
.brand .sub{font-size:13px;color:#d9d2ff;margin-top:2px;letter-spacing:.2px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:22px;font-size:11px;line-height:1.15;text-align:left;margin-top:2px;color:#e7e1ff}
.chip .i{font-size:20px;color:#c9b8ff}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;margin-top:2px;color:#ff7ad9}
.round.gear{color:#c9b8ff}

/* middle */
.mid{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative}
.moon{position:absolute;right:6%;top:46%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ffd9e8,#c87aa0 70%);opacity:.5;filter:blur(1px)}
.hand{position:absolute;top:8px;left:0;right:0;pointer-events:none}
.hand .g{position:absolute;left:36%;top:6px;font:500 20px/1.05 'Caveat',cursive;color:#c9b8ff;transform:rotate(-8deg);text-shadow:0 0 8px #7c3aed}
.hand .a{position:absolute;left:16px;top:-6px;font:500 24px/1 'Caveat',cursive;color:#a99bff;transform:rotate(-6deg);text-shadow:0 0 8px #7c3aed}
#char{position:absolute;inset:0;width:100%;height:100%}
.char-g{transform-origin:200px 400px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.gaze{transition:transform .4s}
[data-state=thinking] .gaze{transform:translate(5px,-7px)}
[data-state=thinking] .char-g{animation:tilt 3s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-1.6deg)}}
.m-smile,.m-open,.m-o{display:none}
.m-smile{display:block}
[data-state=talking] .m-smile{display:none}
[data-state=talking] .m-open{display:block;transform-box:fill-box;transform-origin:center;animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
[data-state=thinking] .m-smile{display:none}
[data-state=thinking] .m-o{display:block}
[data-state=talking] .char-g{animation:bob .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.noanim *{animation:none!important}

/* state cards */
.states{position:absolute;left:12px;top:70px;display:flex;flex-direction:column;gap:12px;width:188px}
.sc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:18px;text-align:left;transition:.25s}
.sc .th{width:50px;height:58px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#3a2468,#1a1038);font-size:26px}
.sc b{display:block;font-size:14px;font-weight:500}
.sc small{display:block;font-size:10px;color:var(--muted);line-height:1.25}
.sc.on{border-color:#8f7bff;box-shadow:0 0 18px rgba(124,92,255,.7),inset 0 0 14px rgba(124,92,255,.25)}
.sc b .i{color:#ff5ccf;margin-right:4px}

/* settings */
.settings{position:absolute;right:10px;top:4px;width:226px;border-radius:20px;z-index:6;display:none;overflow:hidden}
.settings.on{display:block}
.settings header{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;font-weight:500;border-bottom:1px solid rgba(150,130,255,.2)}
.settings header .i{font-size:20px;color:#c9b8ff}
.settings header button{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(124,92,255,.3);display:grid;place-items:center}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;width:100%;text-align:left;border-bottom:1px solid rgba(150,130,255,.14)}
.row:last-child{border-bottom:0}
.row .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:rgba(80,200,170,.18);color:#6ee7c8;flex:none}
.row:nth-child(2) .ico{background:rgba(124,92,255,.22);color:#b9a0ff}
.row:nth-child(4) .ico{background:rgba(90,120,255,.22);color:#9db4ff}
.row .t{flex:1;min-width:0;font-size:12.5px}
.row .t small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .i.ch{font-size:14px;color:var(--muted)}
input[type=range]{width:100%;accent-color:#a78bfa;height:18px;margin:4px 0 0}
.dots{display:flex;gap:7px;margin-top:5px}
.dots button{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.dots button.on{border-color:#fff;box-shadow:0 0 8px #fff8}
.sw{width:44px;height:26px;border-radius:14px;background:#3b3566;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(90deg,#8b5cf6,#c084fc);box-shadow:0 0 12px #8b5cf6}
.sw.on::after{left:21px}

/* speech pill */
.pillwrap{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;z-index:4}
.pill{flex:0 1 300px;min-width:0;border-radius:30px;padding:9px 18px 9px 14px;display:flex;align-items:center;gap:10px;border-color:#6d5cff;box-shadow:0 0 18px rgba(109,92,255,.55),inset 0 0 14px rgba(109,92,255,.2);text-align:center}
.pill .sp{font-size:22px;color:#d8c8ff;flex:none}
.pill .tx{flex:1;min-width:0}
.pill .l1{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill .l2{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:center;gap:3px;height:40px;flex:0 0 auto}
.bars i{display:block;width:3px;height:var(--h);border-radius:2px;background:linear-gradient(#7dd3fc,#a78bfa);opacity:.75;transform:scaleY(.4)}
[data-state=talking] .bars i,[data-state=listening] .bars i{animation:bar .7s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes bar{from{transform:scaleY(.25)}to{transform:scaleY(var(--gain,1))}}
.openbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;z-index:7;padding:11px 22px;border-radius:26px;background:linear-gradient(90deg,#7c3aed,#2563eb);box-shadow:0 0 22px #8b5cf6,0 0 44px #5b8cff88;font-weight:500;font-size:14px;animation:glow 1.4s ease-in-out infinite alternate;display:none;white-space:nowrap}
.openbtn.on{display:block}
@keyframes glow{to{box-shadow:0 0 34px #c084fc,0 0 60px #5b8cffaa}}

/* tiles */
.tiles{display:flex;gap:8px;padding:6px 12px 8px;overflow-x:auto;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:1 0 66px;border-radius:18px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500}
.tile small{font-size:9.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.tile .i{font-size:30px}
.tile:active{transform:scale(.96)}

/* controls */
.controls{display:flex;align-items:center;gap:8px;padding:0 14px 8px;position:relative}
.msg{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border-radius:26px;padding:0 6px 0 12px;height:48px}
.msg .i{font-size:22px;color:#c9b8ff}
.msg input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:14px;height:100%}
.msg input::placeholder{color:#8b84b8}
.msg button{font-size:22px;color:#b9a0ff;width:36px;height:36px;display:grid;place-items:center}
.micwrap{position:relative;width:96px;height:96px;flex:none;margin-top:-18px}
.mic{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 50% 35%,#4f8cff,#7c3aed 70%);box-shadow:0 0 0 3px #1b1450,0 0 0 5px #8b5cf6,0 0 28px #7c3aed,0 0 54px #5b8cffaa}
.mic.live{animation:ring 1.3s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px #1b1450,0 0 0 8px #c084fc,0 0 40px #a855f7,0 0 80px #5b8cffcc}}
.talk{flex:1;min-width:0;border-radius:24px;padding:8px 10px;display:flex;align-items:center;gap:8px;border-color:#6d5cff;box-shadow:0 0 14px rgba(109,92,255,.45);text-align:left}
.talk.live{box-shadow:0 0 22px #a855f7}
.talk .i{font-size:22px;color:#d8c8ff}
.talk b{display:block;font-size:14px;font-weight:500}
.talk small{font-size:11px;color:var(--muted)}

/* nav */
nav{display:flex;margin:0 12px;border-radius:28px;padding:5px 4px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11.5px;color:#9d96c9;border-radius:20px}
nav button .i{font-size:23px}
nav button.on{color:#fff}
nav button.on .i{filter:drop-shadow(0 0 6px #8b5cf6)}
.foot{text-align:center;font-size:9px;letter-spacing:1.6px;color:#8a83b8;padding:8px 0 10px;display:flex;align-items:center;gap:8px;margin:0 22px}
.foot::before,.foot::after{content:"";flex:1;height:1px;background:rgba(150,130,255,.25)}

/* panels, sheets */
.panel{position:absolute;inset:0;background:rgba(3,2,10,.94);backdrop-filter:blur(8px);z-index:8;overflow:auto;padding:16px 16px 24px;display:none}
.panel.on{display:block}
.panel h2{margin:0 0 4px;font:400 34px 'Great Vibes',cursive;color:#e4dcff;text-shadow:0 0 12px #7c3aed}
.panel p.lead{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.card{border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.5}
.card h3{margin:0 0 6px;font-size:14px;font-weight:500}
.mem{display:flex;gap:10px;align-items:flex-start}
.mem span{flex:1}
.mem button{color:#ff8fb0;font-size:18px;padding:2px}
.field{width:100%;background:rgba(10,8,30,.8);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:14px;padding:11px 12px}
.btn{padding:11px 18px;border-radius:22px;background:linear-gradient(90deg,#7c3aed,#2563eb);font-weight:500;font-size:14px;box-shadow:0 0 16px rgba(124,58,237,.6)}
.btn.ghost{background:rgba(124,92,255,.18);box-shadow:none;border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bar{height:10px;border-radius:6px;background:rgba(124,92,255,.2);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ff5ccf)}
.sheetwrap{position:absolute;inset:0;z-index:20;background:rgba(2,2,8,.62);display:none;align-items:flex-end}
.sheetwrap.on{display:flex}
.sheet{width:100%;background:#0e0a26;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82%;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px;font-weight:500}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.5}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:14px;text-align:left;font-size:14px}
.opt.on{background:rgba(124,92,255,.25)}
.bubble{margin:6px 0;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.45;max-width:88%}
.bubble.u{margin-left:auto;background:rgba(80,120,255,.25)}
.bubble.m{background:rgba(124,92,255,.22)}
.toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);z-index:30;max-width:86%;padding:10px 16px;border-radius:16px;font-size:12.5px;line-height:1.4;text-align:center;background:#1b1450;border:1px solid #8b5cf6;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cam{position:absolute;inset:0;z-index:25;background:#000;display:none;flex-direction:column}
.cam.on{display:flex}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.cam .cb{display:flex;gap:10px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media (max-height:700px){.states{gap:6px;top:60px}.sc .th{height:46px;width:42px}.brand h1{font-size:44px}.top{min-height:78px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app" data-bg="night" data-state="idle">

  <header class="top">
    <div class="brand">
      <h1>Maya<span>♥</span></h1>
      <div class="sub">Your Voice Companion</div>
    </div>
    <div class="chip glass" id="mood"><span data-ic="moon"></span><span id="moodTx">A warmer<br>brighter you ♡</span></div>
    <button class="round glass" id="btnMem" aria-label="Memories"><span data-ic="heart"></span></button>
    <button class="round glass gear" id="btnSet" aria-label="Settings"><span data-ic="gear"></span></button>
  </header>

  <div class="mid">
    <section class="stage" id="stage">
      <div class="moon"></div>
      <div class="hand"><div class="a">Always here<br>&nbsp;&nbsp;for you ♥</div><div class="g">Good<br>Things<br>Happen<br>Here ♥</div></div>

      <svg id="char" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet" aria-label="Maya, an animated companion character" role="img">
        <defs>
          <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2358"/><stop offset="1" stop-color="#150b27"/></linearGradient>
          <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6da"/><stop offset="1" stop-color="#ffd2c6"/></linearGradient>
          <radialGradient id="iris" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#4a2a9a"/><stop offset=".6" stop-color="#8f5bff"/><stop offset="1" stop-color="#d6a8ff"/></radialGradient>
          <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1b4d"/><stop offset="1" stop-color="#0f0a22"/></linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g class="char-g">
          <!-- back hair -->
          <path d="M200 40C108 40 66 130 76 232 82 300 58 362 68 440L124 440C134 384 126 334 138 292L262 292C274 334 266 384 276 440L332 440C342 362 318 300 324 232 334 130 292 40 200 40Z" fill="url(#hair)"/>
          <ellipse cx="228" cy="48" rx="56" ry="40" fill="url(#hair)"/>
          <!-- body -->
          <path d="M44 520L58 436C84 398 146 384 200 384 254 384 316 398 342 436L356 520Z" fill="url(#jacket)"/>
          <path d="M70 450C90 430 120 418 150 414M330 450C310 430 280 418 250 414" stroke="#5b8cff" stroke-width="3" fill="none" filter="url(#glow)" opacity=".85"/>
          <path d="M176 336L176 396C190 408 210 408 224 396L224 336Z" fill="#f3c6b8"/>
          <path d="M148 392L200 480 252 392C232 402 168 402 148 392Z" fill="#efeaff"/>
          <path d="M193 440l7 10 7-10-7 14z" fill="#3a2468" opacity=".7"/>
          <!-- choker -->
          <path d="M168 372C190 388 210 388 232 372" stroke="#1a1030" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M200 380l8 9-8 12-8-12z" fill="#b9a0ff" filter="url(#glow)"/>
          <!-- face -->
          <path d="M118 200C116 125 155 90 200 90 245 90 284 125 282 200 281 264 246 322 200 326 154 322 119 264 118 200Z" fill="url(#skin)"/>
          <ellipse cx="148" cy="266" rx="20" ry="10" fill="#ff7fa8" opacity=".32"/>
          <ellipse cx="252" cy="266" rx="20" ry="10" fill="#ff7fa8" opacity=".32"/>
          <!-- earrings -->
          <path d="M112 262v20" stroke="#cbb8ff" stroke-width="1.5"/><path d="M112 282l6 10-6 10-6-10z" fill="#a78bfa" filter="url(#glow)"/>
          <path d="M288 262v20" stroke="#cbb8ff" stroke-width="1.5"/><path d="M288 282l6 10-6 10-6-10z" fill="#a78bfa" filter="url(#glow)"/>
          <!-- eyes -->
          <g class="eye"><g class="gaze">
            <ellipse cx="158" cy="226" rx="27" ry="31" fill="#fff"/>
            <ellipse cx="158" cy="229" rx="20" ry="26" fill="url(#iris)"/>
            <ellipse cx="158" cy="231" rx="9" ry="14" fill="#1b0b36"/>
            <circle cx="150" cy="217" r="6.5" fill="#fff"/><circle cx="168" cy="240" r="3" fill="#fff" opacity=".9"/>
          </g><path d="M128 220C134 192 180 188 190 214" stroke="#1b0b2e" stroke-width="5.5" fill="none" stroke-linecap="round"/></g>
          <g class="eye"><g class="gaze">
            <ellipse cx="242" cy="226" rx="27" ry="31" fill="#fff"/>
            <ellipse cx="242" cy="229" rx="20" ry="26" fill="url(#iris)"/>
            <ellipse cx="242" cy="231" rx="9" ry="14" fill="#1b0b36"/>
            <circle cx="234" cy="217" r="6.5" fill="#fff"/><circle cx="252" cy="240" r="3" fill="#fff" opacity=".9"/>
          </g><path d="M272 220C266 192 220 188 210 214" stroke="#1b0b2e" stroke-width="5.5" fill="none" stroke-linecap="round"/></g>
          <path d="M136 184C150 172 172 172 186 180M264 184C250 172 228 172 214 180" stroke="#2a1745" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M198 266q2 4 5 2" stroke="#e6a698" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- mouth -->
          <g class="m-smile"><path d="M180 288Q200 308 220 288Q200 296 180 288Z" fill="#d8566f" stroke="#c0405a" stroke-width="2" stroke-linejoin="round"/></g>
          <g class="m-open"><ellipse cx="200" cy="294" rx="13" ry="10" fill="#a8384f"/><ellipse cx="200" cy="300" rx="7" ry="4" fill="#ff8fa6"/></g>
          <g class="m-o"><ellipse cx="200" cy="294" rx="5" ry="6" fill="#c0405a"/></g>
          <!-- side locks + bangs -->
          <path d="M120 188C106 240 118 304 100 372 134 340 144 276 140 206Z" fill="url(#hair)"/>
          <path d="M280 188C294 240 282 304 300 372 266 340 256 276 260 206Z" fill="url(#hair)"/>
          <path d="M200 84C158 90 122 120 114 192 142 158 172 130 206 124 240 130 262 158 286 192 278 120 242 90 200 84Z" fill="url(#hair)"/>
          <path d="M150 112C172 100 196 100 214 108" stroke="#7a56b8" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
          <path d="M236 120C250 126 262 138 270 152" stroke="#7a56b8" stroke-width="3" fill="none" opacity=".4" stroke-linecap="round"/>
          <!-- ribbon -->
          <path d="M200 76C168 40 132 62 154 88 172 98 194 90 200 76Z" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="2"/>
          <path d="M200 76C232 40 268 62 246 88 228 98 206 90 200 76Z" fill="#d6ccff" stroke="#8b5cf6" stroke-width="2"/>
          <circle cx="200" cy="78" r="9" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
          <!-- butterfly clip -->
          <g transform="translate(284 150) rotate(20)" filter="url(#glow)"><ellipse cx="-9" cy="-4" rx="11" ry="7" fill="#5ea0ff" transform="rotate(-20)"/><ellipse cx="9" cy="-4" rx="11" ry="7" fill="#7dbbff" transform="rotate(20)"/><ellipse cx="-6" cy="7" rx="7" ry="5" fill="#8b5cf6"/><ellipse cx="6" cy="7" rx="7" ry="5" fill="#a78bfa"/></g>
        </g>
      </svg>

      <aside class="states" id="states">
        <button class="sc glass on" data-s="idle"><span class="th">🙂</span><span><b><span data-ic="heart"></span>Idle</b><small id="idleSm">Listening...<br>Always here</small></span></button>
        <button class="sc glass" data-s="thinking"><span class="th">🤔</span><span><b><span data-ic="chat"></span>Thinking</b><small>Just a sec...<br>Let me think</small></span></button>
        <button class="sc glass" data-s="talking"><span class="th">😊</span><span><b><span data-ic="heart"></span>Talking</b><small>With you...<br>It feels right ♡</small></span></button>
      </aside>

      <section class="settings glass" id="settings" aria-label="Settings">
        <header><span data-ic="gear"></span>Settings<button id="setX" aria-label="Close settings"><span data-ic="x"></span></button></header>
        <button class="row" id="rKey"><span class="ico"><span data-ic="key"></span></span><span class="t">API Key<small id="vKey">Set your key</small></span><span class="ch" data-ic="chev"></span></button>
        <button class="row" id="rWake"><span class="ico"><span data-ic="mic"></span></span><span class="t">Wake Word<small id="vWake">Hey Maya</small></span><span class="ch" data-ic="chev"></span></button>
        <button class="row" id="rMem"><span class="ico"><span data-ic="mem"></span></span><span class="t">Memory<small id="vMem">On (Remembers you)</small></span><span class="ch" data-ic="chev"></span></button>
        <button class="row" id="rLang"><span class="ico"><span data-ic="globe"></span></span><span class="t">Language<small id="vLang">Hindi + English</small></span><span class="ch" data-ic="chev"></span></button>
        <div class="row"><span class="ico"><span data-ic="wave"></span></span><span class="t">Mic Sensitivity<input type="range" id="rMic" min="30" max="100" aria-label="Mic sensitivity"></span></div>
        <div class="row"><span class="ico"><span data-ic="palette"></span></span><span class="t">Background<div class="dots" id="dots"></div></span></div>
        <div class="row"><span class="ico"><span data-ic="play"></span></span><span class="t">Animations<small id="vAnim">On</small></span><button class="sw on" id="swAnim" role="switch" aria-checked="true" aria-label="Animations"></button></div>

      <div class="pillwrap">
        <div class="bars" id="barsL" aria-hidden="true"></div>
        <button class="pill glass" id="pill" aria-label="Show conversation">
          <span class="sp" data-ic="sparkle"></span>
          <span class="tx"><span class="l1" id="pl1" style="display:-webkit-box">Ji, main yahin hoon ♡</span><span class="l2" id="pl2" style="display:block">(Yes, I'm right here ♡)</span></span>
        </button>
        <div class="bars" id="barsR" aria-hidden="true"></div>
      </div>
    </section>

    <div class="tiles" id="tiles">
      <button class="tile glass" data-t="timer"><span data-ic="timer" style="color:#a78bfa"></span>Timer<small>Set a reminder</small></button>
      <button class="tile glass" data-t="call"><span data-ic="phone" style="color:#4ade80"></span>Call<small>Make a call</small></button>
      <button class="tile glass" data-t="maps"><span data-ic="pin" style="color:#60a5fa"></span>Maps<small>Find a place</small></button>
      <button class="tile glass" data-t="wa"><span data-ic="chat" style="color:#25d366"></span>WhatsApp<small>Send a message</small></button>
      <button class="tile glass" data-t="cam"><span data-ic="cam" style="color:#c4b5fd"></span>Camera<small>Take a photo</small></button>
      <button class="tile glass" data-t="cal"><span data-ic="cal" style="color:#f472b6"></span>Calendar<small>Check your day</small></button>

      <form class="msg glass" id="form" autocomplete="off"><span data-ic="keyboard"></span><input id="inp" type="text" placeholder="Type a message..." aria-label="Type a message"><button type="submit" aria-label="Send"><span data-ic="send"></span></button></form>
      <div class="micwrap"><button class="mic" id="mic" aria-label="Talk to Maya"><span data-ic="mic"></span></button></div>
      <button class="talk glass" id="talk"><span data-ic="sparkle"></span><span><b>Let's Talk ♡</b><small id="talkSm">I'm listening...</small></span></button>

    <!-- tab panels -->
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <nav class="glass" id="nav">
    <button class="on" data-tab="home"><span data-ic="home"></span>Home</button>
    <button data-tab="memories"><span data-ic="heart"></span>Memories</button>
    <button data-tab="personality"><span data-ic="star"></span>Personality</button>
    <button data-tab="voice"><span data-ic="wave"></span>Voice</button>
    <button data-tab="more"><span data-ic="grid"></span>More</button>
  </nav>
  <div class="foot">MAYA ♡ MORE THAN AN AI — A COMPANION ♡</div>

  <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet"></div></div>
  <div class="cam" id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="cb"><button class="btn" id="camAsk">What do you see, Maya?</button><button class="btn ghost" id="camClose">Close</button></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('maya.' + k); return v == null ? d : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem('maya.' + k, JSON.stringify(v)); }catch(e){} }
};
const IC = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  heart:'<path d="M12 21s-7-4.6-9.3-9.1C1 8.5 3 5 6.400 5c2 0 3.600 1.100 5.600 3.200C14 6.100 15.600 5 17.600 5 21 5 23 8.500 21.300 11.900 19 16.400 12 21 12 21z"/>',
  star:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
  wave:'<path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2"/>',
  grid:'<rect x="3.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="3.500" y="13.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="13.500" width="7" height="7" rx="1.500"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/>',
  moon:'<path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  mem:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 10h6M9 14h4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.500 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.500 0 2-1 1.500-2s0-2 1.500-2h2a3 3 0 0 0 3-3C20 9 16.500 3 12 3z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.500" r="1"/><circle cx="16" cy="11" r="1"/>',
  play:'<rect x="3.500" y="4" width="17" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  phone:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  pin:'<path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/>',
  cal:'<rect x="3.500" y="5" width="17" height="15" rx="2"/><path d="M3.500 10h17M8 3v4M16 3v4"/>',
  send:'<path d="M4 12l16-8-6 16-3-7z"/>',
  keyboard:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  sparkle:'<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/><path d="M19 17v4M17 19h4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
function icons(root = document){
  $$('[data-ic]', root).forEach(el => {
    if (el.dataset.done) return;
    el.dataset.done = 1;
    const n = el.dataset.ic;
    const svg = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
    if (el.tagName === 'SPAN' && !el.className) { el.outerHTML = svg; } else { el.insertAdjacentHTML('afterbegin', svg); }
  });
}
icons();

/* ---------- state ---------- */
const LANGS = [
  {id:'hi-en', label:'Hindi + English', rec:'hi-IN'},
  {id:'bn', label:'Bangla', rec:'bn-BD'},
  {id:'en', label:'English', rec:'en-IN'},
  {id:'ur', label:'Urdu', rec:'ur-PK'},
  {id:'tl', label:'Tagalog', rec:'fil-PH'}
];
const BGS = {night:'#1b1340', blue:'#4f8cff', pink:'#ff7ad9', violet:'#a855f7'};
const S = {
  key: store.get('key', ''), model: store.get('model', 'gemini-3.8-flash'),
  lang: store.get('lang', 'hi-en'), memOn: store.get('memOn', true), anim: store.get('anim', true),
  mic: store.get('mic', 70), bg: store.get('bg', 'night'), wake: store.get('wake', 'Hey Maya'),
  rate: store.get('rate', 1), pitch: store.get('pitch', 1.15), voice: store.get('voice', ''),
  memories: store.get('memories', []), hist: store.get('hist', [])
};
if (S.model === 'gemini-2.5-flash') { S.model = 'gemini-3.8-flash'; store.set('model', S.model); }
const LANG = () => LANGS.find(l => l.id === S.lang) || LANGS[0];
const app = $('#app');
let busy = false, live = false, turn = 0, pending = null;

/* ---------- UI plumbing ---------- */
function toast(t, ms = 3200){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); }
function setState(s){
  app.dataset.state = s;
  const card = s === 'listening' ? 'idle' : s;
  $$('.sc').forEach(b => b.classList.toggle('on', b.dataset.s === card));
  $('#idleSm').innerHTML = s === 'listening' ? 'Listening...<br>Go ahead ♡' : 'Listening...<br>Always here';
}
function pill(l1, l2 = ''){ $('#pl1').textContent = l1; $('#pl2').textContent = l2; $('#pl2').style.display = l2 ? 'block' : 'none'; }
function mkBars(el, rev){
  el.innerHTML = Array.from({length: 9}, (_, i) => { const k = rev ? 8 - i : i; return `<i style="--h:${(8 + Math.abs(Math.sin(k * 1.7)) * 24).toFixed(0)}px;--d:${(k * 0.09).toFixed(2)}s"></i>`; }).join('');
}
mkBars($('#barsL'), false); mkBars($('#barsR'), true);
function applyGain(){ app.style.setProperty('--gain', (0.5 + S.mic / 100).toFixed(2)); }
function applyBg(){ app.dataset.bg = S.bg; $$('#dots button').forEach(b => b.classList.toggle('on', b.dataset.bg === S.bg)); }
function applyAnim(){ app.classList.toggle('noanim', !S.anim); $('#swAnim').classList.toggle('on', S.anim); $('#swAnim').setAttribute('aria-checked', S.anim); $('#vAnim').textContent = S.anim ? 'On' : 'Off'; }
function renderSettings(){
  $('#vKey').textContent = S.key ? 'Key saved ✓' : 'Set your key';
  $('#vWake').textContent = S.wake;
  $('#vMem').textContent = S.memOn ? 'On (Remembers you)' : 'Off';
  $('#vLang').textContent = LANG().label;
  $('#rMic').value = S.mic;
  applyAnim(); applyBg(); applyGain();
}
$('#dots').innerHTML = Object.entries(BGS).map(([k, c]) => `<button data-bg="${k}" style="background:${c}" aria-label="${k} background"></button>`).join('');
$('#dots').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.bg = b.dataset.bg; store.set('bg', S.bg); applyBg(); });
$('#rMic').addEventListener('input', e => { S.mic = +e.target.value; store.set('mic', S.mic); applyGain(); });
$('#swAnim').addEventListener('click', () => { S.anim = !S.anim; store.set('anim', S.anim); applyAnim(); });
$('#btnSet').addEventListener('click', () => $('#settings').classList.toggle('on'));
$('#setX').addEventListener('click', () => $('#settings').classList.remove('on'));
$('#btnMem').addEventListener('click', () => tab('memories'));
$$('.sc').forEach(b => b.addEventListener('click', () => { if (!busy && !live) { setState(b.dataset.s); setTimeout(() => setState('idle'), 2500); } }));

/* sheets */
function sheet(html, mount){
  $('#sheet').innerHTML = html; icons($('#sheet'));
  $('#sheetwrap').classList.add('on');
  mount && mount($('#sheet'));
}
function closeSheet(){ $('#sheetwrap').classList.remove('on'); }
$('#sheetwrap').addEventListener('click', e => { if (e.target.id === 'sheetwrap') closeSheet(); });

function keySheet(){
  sheet(`<h3>Gemini API key</h3>
    <p>Maya talks through your own free Gemini key from Google AI Studio. It stays on this device only.</p>
    <input class="field" id="kIn" type="password" placeholder="Paste your API key" value="${esc(S.key)}" autocomplete="off" aria-label="API key">
    <p style="margin-top:10px">Model</p>
    <input class="field" id="kModel" type="text" value="${esc(S.model)}" aria-label="Model name">
    <div class="btnrow"><button class="btn" id="kSave">Save key</button><button class="btn ghost" id="kClear">Remove</button></div>`,
  el => {
    $('#kSave', el).onclick = () => { S.key = $('#kIn', el).value.trim(); S.model = $('#kModel', el).value.trim() || 'gemini-3.8-flash'; store.set('key', S.key); store.set('model', S.model); renderSettings(); closeSheet(); toast(S.key ? 'Key saved. Say hi to Maya!' : 'Key removed.'); };
    $('#kClear', el).onclick = () => { S.key = ''; store.set('key', ''); renderSettings(); closeSheet(); };
  });
}
function wakeSheet(){
  sheet(`<h3>Wake word</h3>
    <p>The wake word listens in the background only in the Android app build. In the browser, tap the mic or "Let's Talk" instead.</p>
    <input class="field" id="wIn" value="${esc(S.wake)}" aria-label="Wake word">
    <div class="btnrow"><button class="btn" id="wSave">Save</button></div>`,
  el => { $('#wSave', el).onclick = () => { S.wake = $('#wIn', el).value.trim() || 'Hey Maya'; store.set('wake', S.wake); renderSettings(); closeSheet(); }; });
}
function langSheet(){
  sheet(`<h3>Language</h3><p>This sets what the microphone listens for. Maya always replies in the language you actually speak.</p>` +
    LANGS.map(l => `<button class="opt ${l.id === S.lang ? 'on' : ''}" data-l="${l.id}">${l.label}</button>`).join(''),
  el => $$('.opt', el).forEach(b => b.onclick = () => { S.lang = b.dataset.l; store.set('lang', S.lang); renderSettings(); closeSheet(); if (live) { stopListening(); startListening(); } }));
}
function chatSheet(){
  const items = S.hist.slice(-20).map(m => `<div class="bubble ${m.role === 'user' ? 'u' : 'm'}">${esc(m.text)}</div>`).join('') || '<p>No messages yet. Say hi!</p>';
  sheet(`<h3>Conversation</h3>${items}<div class="btnrow"><button class="btn ghost" id="hClr">Clear conversation</button></div>`,
    el => $('#hClr', el).onclick = () => { S.hist = []; store.set('hist', []); closeSheet(); toast('Conversation cleared.'); });
}
$('#rKey').onclick = keySheet; $('#rWake').onclick = wakeSheet; $('#rLang').onclick = langSheet; $('#pill').onclick = chatSheet;
$('#rMem').onclick = () => { S.memOn = !S.memOn; store.set('memOn', S.memOn); renderSettings(); toast(S.memOn ? 'Memory is on.' : 'Memory is off. Maya will not save or use memories.'); };

/* tabs */
function tab(name){
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  const p = $('#panel');
  if (name === 'home'){ p.classList.remove('on'); return; }
  p.classList.add('on'); p.innerHTML = renderTab(name); icons(p); mountTab(name, p);
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) tab(b.dataset.tab); });

function renderTab(name){
  if (name === 'memories') return `<h2>Memories</h2><p class="lead">Things Maya remembers about you. ${S.memOn ? '' : 'Memory is currently off.'}</p>
    <div id="memList">${memHTML()}</div>
    <div class="btnrow" style="margin-top:14px"><input class="field" id="mAdd" placeholder="Add something Maya should remember" style="flex:1" aria-label="New memory"><button class="btn" id="mBtn">Add</button></div>
    ${S.memories.length ? '<div class="btnrow"><button class="btn ghost" id="mClr">Forget everything</button></div>' : ''}`;
  if (name === 'personality') return `<h2>Personality</h2><p class="lead">Maya is a soft-spoken, sweet AI companion, created by Tanim Boss.</p>
    <div class="card glass"><h3>Shy and gentle · 50%</h3><div class="bar"><i style="width:50%"></i></div>
    <h3>Caring and attentive · 30%</h3><div class="bar"><i style="width:30%"></i></div>
    <h3>Playful and teasing · 20%</h3><div class="bar"><i style="width:20%"></i></div></div>
    <div class="card glass"><h3>How she talks</h3>She speaks Bangla, English, Hindi, Hinglish, Urdu or Tagalog, matching you. In Hindi, Hinglish and Urdu she uses "Aap" and "Ji". Replies stay short and warm.</div>
    <div class="card glass"><h3>What she promises</h3>She is always honest that she is an AI. She never pressures you, never guilt-trips, and encourages you to keep your real friendships and family close.</div>`;
  if (name === 'voice') return `<h2>Voice</h2><p class="lead">Tune how Maya sounds. Voices come from your phone or browser.</p>
    <div class="card glass"><h3>Voice</h3><select class="field" id="vSel" aria-label="Voice"></select></div>
    <div class="card glass"><h3>Speed</h3><input type="range" id="vRate" min="0.7" max="1.3" step="0.05" value="${S.rate}"><h3 style="margin-top:10px">Pitch</h3><input type="range" id="vPitch" min="0.8" max="1.5" step="0.05" value="${S.pitch}"></div>
    <div class="btnrow"><button class="btn" id="vTest">Hear Maya</button><button class="btn ghost" id="vLang">Listening language</button></div>`;
  return `<h2>More</h2><p class="lead">Made by Tanim Boss. Maya is an AI character, not a person.</p>
    <div class="card glass"><h3>Install on your phone</h3>In Chrome, open the menu and choose "Add to Home screen" to launch Maya like an app.</div>
    <div class="card glass"><h3>What works in the browser</h3>Voice chat, memory, camera look, background colors, timers and alarms (only while Maya is open). Calls, WhatsApp, Maps and Calendar open ready to tap. Reading and replying to notifications needs the Android app build.</div>
    <div class="btnrow"><button class="btn ghost" id="mExp">Copy memories</button><button class="btn ghost" id="mReset">Reset everything</button></div>`;
}
function memHTML(){
  return S.memories.length ? S.memories.map(m => `<div class="card glass mem"><span>${esc(m.text)}</span><button data-del="${m.id}" aria-label="Delete memory"><svg class="i" viewBox="0 0 24 24">${IC.trash}</svg></button></div>`).join('') : '<div class="card glass">Nothing saved yet. Tell Maya something about you, like "I like mango juice".</div>';
}
function mountTab(name, p){
  if (name === 'memories'){
    const refresh = () => { $('#memList', p).innerHTML = memHTML(); };
    p.onclick = e => { const d = e.target.closest('[data-del]'); if (d){ S.memories = S.memories.filter(m => m.id !== d.dataset.del); store.set('memories', S.memories); refresh(); } if (e.target.id === 'mClr'){ S.memories = []; store.set('memories', []); tab('memories'); } };
    $('#mBtn', p).onclick = () => { const v = $('#mAdd', p).value.trim(); if (!v) return; addMemory(v); tab('memories'); };
  }
  if (name === 'voice'){
    const sel = $('#vSel', p);
    const fill = () => { const vs = speechSynthesis.getVoices(); sel.innerHTML = '<option value="">Auto (best match)</option>' + vs.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === S.voice ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''); };
    if ('speechSynthesis' in window){ fill(); speechSynthesis.onvoiceschanged = fill; }
    sel.onchange = () => { S.voice = sel.value; store.set('voice', S.voice); };
    $('#vRate', p).oninput = e => { S.rate = +e.target.value; store.set('rate', S.rate); };
    $('#vPitch', p).oninput = e => { S.pitch = +e.target.value; store.set('pitch', S.pitch); };
    $('#vTest', p).onclick = () => speak('Hehe, hi. Main Maya hoon. Kaisi lag rahi hai meri awaaz?');
    $('#vLang', p).onclick = langSheet;
  }
  if (name === 'more'){
    $('#mExp', p).onclick = async () => { try{ await navigator.clipboard.writeText(JSON.stringify(S.memories.map(m => m.text), null, 2)); toast('Memories copied.'); }catch(e){ toast('Could not copy. Open Memories to read them.'); } };

function detectLang(t){
  if (/[\u0980-\u09FF]/.test(t)) return 'bn-BD';
  if (/[\u0900-\u097F]/.test(t)) return 'hi-IN';
  if (/[\u0600-\u06FF]/.test(t)) return 'ur-PK';
  if (S.lang === 'tl') return 'fil-PH';

}
function pickVoice(lang){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices(); const pre = lang.slice(0, 2).toLowerCase();
  const chosen = vs.find(v => v.voiceURI === S.voice);
  if (chosen && chosen.lang.toLowerCase().startsWith(pre)) return chosen;
  const c = vs.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(pre) || (pre === 'fi' && v.lang.toLowerCase().startsWith('tl')));
  return c.find(v => /female|woman|heera|swara|neerja|priya|tanishaa|google/i.test(v.name)) || c[0] || null;
}
function speak(text){
  return new Promise(res => {
    const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF♡♥]/gu, '').replace(/[*_`#]/g, '').trim();
    if (!clean || !('speechSynthesis' in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean), lang = detectLang(clean);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = S.rate; u.pitch = S.pitch;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(hard); res(); };
    const hard = setTimeout(fin, clean.length * 130 + 5000);
